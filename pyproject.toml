[project]
name = "autofix-scanner"
version = "0.1.0"
description = "Git-aware code scanner that explains findings with an LLM"
requires-python = ">=3.11"
license = "MIT"
readme = "README.md"
authors = [
    { name = "Hassam Sheikh", email = "hassamsheikh1@gmail.com" },
]
dependencies = [
    "tree-sitter>=0.21,<0.26",
    "tree-sitter-python>=0.21,<0.26",
    "opentelemetry-api>=1.20,<2",
    "opentelemetry-sdk>=1.20,<2",
    "pathspec~=0.12",
]

[project.scripts]
autofix = "autofix.cli.main:main"

[project.optional-dependencies]
benchmark = [
    # agent-bench is a sibling repo; install with:
    #   pip install -e ../agent-bench
    # or point --agent-bench-root at the checkout directory.
]
dedup = [
    "sentence-transformers>=3,<4",
    "hnswlib>=0.8,<0.9",
]
jsts = ["tree-sitter-typescript>=0.21,<0.26"]
go = ["tree-sitter-go>=0.21,<0.26"]
linter = ["ruff>=0.1,<1.0", "mypy>=1.0,<2.0"]
telemetry-otlp = ["opentelemetry-exporter-otlp-proto-http>=1.20,<2"]
test = ["jsonschema>=4.20,<5"]
watch = ["pywatchman>=1.4,<2"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["autofix*"]

[tool.setuptools.package-data]
"autofix.llm_io" = ["prompts/*.md"]
"autofix.llm" = ["prompts/*.md"]

[tool.pytest.ini_options]
# --import-mode=importlib prevents tests/<name>/__init__.py from shadowing a
# same-named top-level package at repo root (e.g. tests/autofix/ vs
# autofix/). Without this, pytest inserts tests/ at sys.path[0] under
# the default "prepend" importmode and the test-dir package wins.
addopts = "--import-mode=importlib"
markers = [
    "integration: end-to-end integration tests that exercise multiple subsystems",
    "requires_claude_cli: tests that require the real claude CLI on PATH (skipped by default)",
    "requires_dedup_extras: tests that require the [dedup] optional extras (skipped when deps unavailable)",
    "requires_scip_binaries: tests that invoke scip-typescript/scip-go subprocesses (skipped when AUTOFIX_OFFLINE=1 or ensure_binary raises BinaryUnavailableError)",
]
